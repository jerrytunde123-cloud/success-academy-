<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Success Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container" onclick="window.location.href='index.html'">
            <img src="assets/logo.png" alt="Logo" class="header-logo" onerror="this.src='https://via.placeholder.com/60?text=SA'">
            <div>
                <h1>SUCCESS ACADEMY</h1>
                <span>Admin Dashboard</span>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html" style="color:var(--accent-yellow);">Back to Home</a></li>
                <li><a href="#" onclick="adminLogout()" style="color:#ff4444; text-decoration:underline;">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="admin-container" style="max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">

        <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #001f5b; padding-bottom: 15px; margin-bottom: 20px;">
            <h1 style="color: #001f5b; margin: 0;">Admin Dashboard</h1>
        </div>

        <!-- Admin login gate -->
        <div id="admin-login" style="background:#f8f9fa; padding:20px; border-radius:8px; text-align:center; margin-bottom:20px;">
            <h3>Admin Login</h3>
            <input type="password" id="admin-pass" placeholder="Enter admin password" style="padding:10px; width:200px; margin:10px 0;">
            <button class="btn-buy" onclick="adminLogin()" style="width:auto;">Unlock Dashboard</button>
        </div>

        <div id="admin-dashboard" style="display: none;">

            <h3 style="color: #001f5b;">Select Exam to Configure</h3>
            <select id="admin-exam-select" onchange="loadExamConfig()">
                <option value="">-- Select Exam --</option>
            </select>

            <div class="config-section" id="exam-config-area" style="display: none; background:#f8f9fa; padding:20px; border-radius:8px; margin-bottom:20px; border:1px solid #ddd;">
                <h3 id="config-exam-name">Configure Exam</h3>
                <div class="config-row" style="display:flex; gap:15px; align-items:center; margin-bottom:15px; flex-wrap:wrap;">
                    <label>Price Per Subject (₦):</label>
                    <input type="number" id="price-per-subject" style="padding:8px; border:1px solid #ccc; border-radius:4px; width:120px;">
                    <label><input type="checkbox" id="allow-per-subject"> Enable Per Subject</label>
                </div>
                <div class="config-row" style="display:flex; gap:15px; align-items:center; margin-bottom:15px; flex-wrap:wrap;">
                    <label>Price Per Dept (₦):</label>
                    <input type="number" id="price-per-dept" style="padding:8px; border:1px solid #ccc; border-radius:4px; width:120px;">
                    <label><input type="checkbox" id="allow-per-dept"> Enable Per Dept</label>
                </div>
                <div class="config-row" style="display:flex; gap:15px; align-items:center; margin-bottom:15px; flex-wrap:wrap;">
                    <label>Price All Subjects (₦):</label>
                    <input type="number" id="price-all-subjects" style="padding:8px; border:1px solid #ccc; border-radius:4px; width:120px;">
                    <label><input type="checkbox" id="allow-all"> Enable All Subjects</label>
                </div>
                <button class="btn-buy" onclick="saveExamConfig()">Save Configuration</button>
            </div>

            <hr style="margin: 30px 0; border: 1px solid #ddd;">

            <div class="config-section" id="content-upload-area" style="display: none; background:#f8f9fa; padding:20px; border-radius:8px; border:1px solid #ddd;">
                <h3>Upload Content & Preview Image</h3>
                <label>Select Subject:</label>
                <select id="admin-subject-select" style="padding:10px; border-radius:5px; border:1px solid #ccc; width:100%; margin-bottom:10px;"></select>
                <label>Preview Image URL:</label>
                <input type="text" id="admin-image-url" placeholder="e.g. https://i.imgur.com/yourimage.jpg" style="margin-bottom:15px; padding:10px; width:100%; border:1px solid #ccc; border-radius:5px;">
                <label>Paste Questions/Answers Here:</label>
                <textarea id="admin-content-input" placeholder="1. A&#10;2. B&#10;3. C..." style="width:100%; height:100px; padding:10px; border:1px solid #ccc; border-radius:5px; font-family:monospace; margin-top:10px;"></textarea>
                <button class="btn-buy" onclick="saveContent()" style="margin-top:10px;">Save Subject Data</button>
            </div>

        </div>

    </div>

    <script src="admin.js"></script>
</body>
</html>
