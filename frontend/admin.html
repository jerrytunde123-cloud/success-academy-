<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Success Academy</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        /* ... (Keep your existing styles) ... */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: #001f5b; color: white; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-box h2 { margin: 0; font-size: 32px; color: var(--accent-yellow); }
        .stat-box p { margin: 5px 0 0 0; font-size: 14px; }
    </style>
</head>
<body>
    <!-- Login Screen ... -->

    <div id="dashboard" class="container">
        <!-- Header ... -->
        
        <!-- NEW: STATS -->
        <div class="stats-grid">
            <div class="stat-box">
                <h2 id="stat-today">0</h2>
                <p>Visitors Today</p>
            </div>
            <div class="stat-box">
                <h2 id="stat-total">0</h2>
                <p>Total Visitors</p>
            </div>
            <div class="stat-box">
                <h2 id="stat-pins">0</h2>
                <p>Total PINs Sold</p>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('exams', event)">Manage Exams</button>
            <button class="tab" onclick="switchTab('pins', event)">PIN History</button>
            <button class="tab" onclick="switchTab('news', event)">Manage News</button> <!-- NEW TAB -->
            <button class="tab" onclick="switchTab('enquiries', event)">Enquiries</button>
        </div>

        <!-- EXAM TAB ... -->

        <!-- NEW: NEWS TAB -->
        <div id="tab-news" class="section">
            <div style="background:#f8f9fa; padding:15px; border-radius:8px; margin-bottom:20px;">
                <h3>Publish New Update</h3>
                <input type="text" id="news-title" placeholder="Title (e.g., WAEC Timetable Released)">
                <textarea id="news-content" rows="5" placeholder="Write your update here..."></textarea>
                <button class="save-btn" onclick="publishNews()">Publish Update</button>
            </div>
            <h3>Published Updates</h3>
            <div id="news-list"></div>
        </div>

        <!-- PINS TAB ... -->
        <!-- ENQUIRIES TAB ... -->
    </div>

    <script>
        window.onload = function() {
            const ADMIN_PASSWORD = "admin123"; 
            const API_URL = 'https://success-academy-backend-mh1o.onrender.com/api'; 
            
            // ... (Keep your existing variables) ...

            window.checkPassword = function() {
                if(document.getElementById('admin-password').value === ADMIN_PASSWORD) {
                    localStorage.setItem('sa_admin_logged_in', 'true');
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    initDashboard();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            };

            // ... (Keep logout, switchTab) ...
            
            // ⚠️ UPDATE switchTab to include news
            window.switchTab = function(tabId, event) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                event.target.classList.add('active');
                document.getElementById('tab-' + tabId).classList.add('active');
                if(tabId === 'enquiries') loadEnquiries();
                if(tabId === 'pins') loadPinHistory();
                if(tabId === 'news') loadNews();
            };

            async function initDashboard() {
                // Fetch Stats
                try {
                    const statRes = await fetch(`${API_URL}/admin/stats`, { cache: "no-store" });
                    const stats = await statRes.json();
                    document.getElementById('stat-today').innerText = stats.todayVisitors;
                    document.getElementById('stat-total').innerText = stats.totalVisitors;
                    document.getElementById('stat-pins').innerText = stats.totalPinsSold;
                } catch(e) { console.log("Stats failed to load"); }

                // Fetch Exams (Existing code)
                var select = document.getElementById('exam-select');
                select.innerHTML = '<option value="">-- Waking up server... --</option>';
                try {
                    const res = await fetch(`${API_URL}/exams`, { cache: "no-store" });
                    exams = await res.json();
                    select.innerHTML = '<option value="">-- Select Exam --</option>';
                    exams.forEach(exam => { select.innerHTML += `<option value="${exam._id}">${exam.name}</option>`; });
                    // ... (Rest of initDashboard) ...
                } catch (e) { select.innerHTML = '<option value="">-- Server Error --</option>'; }
            }

            // ... (Keep loadExamConfig, loadSubjectData, etc.) ...

            // ⚠️ NEW: NEWS FUNCTIONS
            window.publishNews = async function() {
                const title = document.getElementById('news-title').value;
                const content = document.getElementById('news-content').value;
                if(!title || !content) return alert('Title and Content are required.');
                
                await fetch(`${API_URL}/admin/news`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });
                alert('News Published!');
                document.getElementById('news-title').value = '';
                document.getElementById('news-content').value = '';
                loadNews();
            }

            async function loadNews() {
                const res = await fetch(`${API_URL}/news`, { cache: "no-store" });
                const news = await res.json();
                const list = document.getElementById('news-list');
                list.innerHTML = '';
                if(news.length === 0) { list.innerHTML = '<p>No news yet.</p>'; return; }
                
                news.forEach(item => {
                    const date = new Date(item.date).toLocaleDateString();
                    list.innerHTML += `
                        <div style="background:white; border:1px solid #ddd; padding:15px; border-radius:8px; margin-bottom:10px; display:flex; justify-content:space-between;">
                            <div>
                                <h4 style="margin:0 0 5px 0; color:#001f5b;">${item.title}</h4>
                                <p style="font-size:12px; color:#888; margin:0 0 10px 0;">${date}</p>
                                <p style="margin:0;">${item.content}</p>
                            </div>
                            <button onclick="deleteNews(${item.id})" style="background:red; color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer; height:30px;">Delete</button>
                        </div>
                    `;
                });
            }

            window.deleteNews = async function(id) {
                if(!confirm('Delete this update?')) return;
                await fetch(`${API_URL}/admin/news/${id}`, { method: 'DELETE' });
                loadNews();
            }

            // ... (Keep the rest of your existing functions: uploadThumbnail, etc.) ...
        };
    </script>
</body>
</html>
