<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Success Academy</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #001f5b; padding-bottom: 15px; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: #ddd; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .tab.active { background: #001f5b; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button.save-btn { background: #001f5b; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .row { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #001f5b; color: white; }
        .btn-reply { background: #25D366; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Admin Dashboard</h1>
            <a href="index.html" style="background:#ff4444; color:white; padding:10px; text-decoration:none; border-radius:5px;">Log Out</a>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('exams', event)">Manage Exams</button>
            <button class="tab" onclick="switchTab('pins', event)">PIN History</button>
            <button class="tab" onclick="switchTab('enquiries', event)">Enquiries</button>
        </div>

        <!-- EXAMS TAB -->
        <div id="tab-exams" class="section active">
            <select id="exam-select" onchange="loadExamConfig()">
                <option value="">-- Select Exam --</option>
            </select>

            <div class="section" id="config-area" style="display:none; background:#f8f9fa; padding:15px; border-radius:8px; margin-bottom: 20px;">
                <h3>Configure <span id="config-name"></span></h3>
                <div class="row"><label>Per Subject (₦):</label> <input type="number" id="price-per-subject"> <input type="checkbox" id="allow-per-subject"> Enable</div>
                <div class="row"><label>Per Dept (₦):</label> <input type="number" id="price-per-dept"> <input type="checkbox" id="allow-per-dept"> Enable</div>
                <div class="row"><label>All Subjects (₦):</label> <input type="number" id="price-all-subjects"> <input type="checkbox" id="allow-all"> Enable</div>
                <button class="save-btn" onclick="saveConfig()">Save Prices</button>
            </div>

            <div class="section" id="content-area" style="display:none; background:#f8f9fa; padding:15px; border-radius:8px;">
                <h3>Upload Content & Image</h3>
                <label>Select Subject:</label> <select id="subject-select" onchange="loadSubjectData()"></select>
                <label>Upload Image (JPEG/PNG):</label> <input type="file" id="image-upload" accept="image/*">
                <img id="preview-img" style="max-height:100px; display:none; margin-bottom:10px;">
                <label>Answers:</label> <textarea id="content-input" rows="5"></textarea>
                <button class="save-btn" onclick="saveSubjectData()">Save Subject</button>
            </div>
        </div>

        <!-- PINS TAB -->
        <div id="tab-pins" class="section">
            <div style="background:#f8f9fa; padding:15px; border-radius:8px; margin-bottom:20px;">
                <h3>Generate Manual PIN</h3>
                <div class="row">
                    <select id="manual-exam-select" onchange="loadManualSubjects()"></select>
                </div>
                <div class="row">
                    <input type="text" id="manual-device-id" placeholder="Enter User's Device ID (Required)">
                </div>
                <div class="row">
                    <input type="text" id="manual-pin-input" placeholder="Enter Custom PIN (e.g. ABC123)">
                </div>
                <div id="manual-subjects-area" style="max-height: 100px; overflow-y:auto; border:1px solid #ddd; padding:10px; margin-bottom:10px;">
                    <!-- Checkboxes -->
                </div>
                <button class="save-btn" onclick="generateManualPin()">Generate PIN</button>
            </div>

            <h3>All Purchased PINs</h3>
            <table>
                <thead><tr><th>Date</th><th>Exam</th><th>PIN</th><th>Device ID</th><th>Subjects</th></tr></thead>
                <tbody id="pins-table-body"></tbody>
            </table>
        </div>

        <!-- ENQUIRIES TAB -->
        <div id="tab-enquiries" class="section">
            <h3>Customer Enquiries</h3>
            <table>
                <thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Exam</th><th>Message</th><th>Action</th></tr></thead>
                <tbody id="enquiry-table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="reply-modal" class="modal">
        <div class="modal-content">
            <h3>Reply to <span id="reply-name"></span></h3>
            <textarea id="reply-message" rows="4" placeholder="Type your reply..."></textarea>
            <button class="save-btn" onclick="sendEmailReply()" style="width:100%; margin-top:10px;">Send Email</button>
            <button onclick="closeModal()" style="width:100%; margin-top:5px; background:#ccc; border:none; padding:10px; border-radius:5px;">Cancel</button>
            <p id="email-status" style="color:green; font-weight:bold; margin-top:10px;"></p>
        </div>
    </div>

    <script>
        // ⚠️ EMAILJS CONFIG
        emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); 
        const EMAILJS_SERVICE_ID = "YOUR_SERVICE_ID"; 
        const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";

        // ⚠️ BACKEND URL
        const API_URL = 'https://success-academy-backend-mh1o.onrender.com/api'; 
        
        let exams = [];
        let activeExam = null;
        let currentReplyData = null;

        function switchTab(tabId, event) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
            
            if(tabId === 'enquiries') loadEnquiries();
            if(tabId === 'pins') loadPinHistory();
        }

        window.onload = async () => {
            try {
                const res = await fetch(`${API_URL}/exams`);
                exams = await res.json();
                
                // Populate Main Dropdown
                const select = document.getElementById('exam-select');
                select.innerHTML = '<option value="">-- Select Exam --</option>';
                exams.forEach(exam => { select.innerHTML += `<option value="${exam._id}">${exam.name}</option>`; });

                // Populate Manual PIN Dropdown
                const manualSelect = document.getElementById('manual-exam-select');
                exams.forEach(exam => { manualSelect.innerHTML += `<option value="${exam._id}">${exam.name}</option>`; });
                loadManualSubjects();

            } catch (e) { alert("Failed to connect to backend."); }
        };

        // --- EXAM MANAGEMENT ---
        function loadExamConfig() {
            const id = document.getElementById('exam-select').value;
            if(!id) return;
            activeExam = exams.find(e => e._id === id);
            document.getElementById('config-area').style.display = 'block';
            document.getElementById('content-area').style.display = 'block';
            document.getElementById('config-name').innerText = activeExam.name;
            
            document.getElementById('price-per-subject').value = activeExam.prices.per_subject;
            document.getElementById('allow-per-subject').checked = activeExam.allow.per_subject;
            document.getElementById('price-per-dept').value = activeExam.prices.per_dept;
            document.getElementById('allow-per-dept').checked = activeExam.allow.per_dept;
            document.getElementById('price-all-subjects').value = activeExam.prices.all_subjects;
            document.getElementById('allow-all').checked = activeExam.allow.all_subjects;

            const subSelect = document.getElementById('subject-select');
            subSelect.innerHTML = '';
            activeExam.subjects.forEach(sub => { subSelect.innerHTML += `<option value="${sub.name}">${sub.name}</option>`; });
            loadSubjectData();
        }

        function loadSubjectData() {
            const subName = document.getElementById('subject-select').value;
            const subject = activeExam.subjects.find(s => s.name === subName);
            document.getElementById('content-input').value = subject.content || '';
            const imgPreview = document.getElementById('preview-img');
            if(subject.previewImage) { imgPreview.src = subject.previewImage; imgPreview.style.display = 'block'; } 
            else { imgPreview.style.display = 'none'; }
        }

        async function saveConfig() {
            const updatedData = {
                prices: {
                    per_subject: Number(document.getElementById('price-per-subject').value),
                    per_dept: Number(document.getElementById('price-per-dept').value),
                    all_subjects: Number(document.getElementById('price-all-subjects').value)
                },
                allow: {
                    per_subject: document.getElementById('allow-per-subject').checked,
                    per_dept: document.getElementById('allow-per-dept').checked,
                    all_subjects: document.getElementById('allow-all').checked
                }
            };
            await fetch(`${API_URL}/exams/${activeExam._id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updatedData) });
            alert('Prices Updated!');
        }

        async function saveSubjectData() {
            const subName = document.getElementById('subject-select').value;
            const content = document.getElementById('content-input').value;
            const imageFile = document.getElementById('image-upload').files[0];
            let imageUrl = activeExam.subjects.find(s => s.name === subName).previewImage;

            if (imageFile) {
                const formData = new FormData();
                formData.append('image', imageFile);
                const uploadRes = await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
                const uploadData = await uploadRes.json();
                imageUrl = uploadData.imageUrl;
            }

            const updatedSubjects = activeExam.subjects.map(sub => sub.name === subName ? { ...sub, content: content, previewImage: imageUrl } : sub);
            await fetch(`${API_URL}/exams/${activeExam._id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subjects: updatedSubjects }) });
            alert('Content Saved!');
            document.getElementById('image-upload').value = '';
        }

        // --- PIN MANAGEMENT ---
        async function loadPinHistory() {
            const res = await fetch(`${API_URL}/admin/pins`);
            const pins = await res.json();
            const tbody = document.getElementById('pins-table-body');
            tbody.innerHTML = '';
            
            pins.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(p.date).toLocaleDateString()}</td>
                        <td>${p.examId ? p.examId.name : 'Deleted Exam'}</td>
                        <td style="font-weight:bold; color:green;">${p.pin}</td>
                        <td><code>${p.deviceId}</code></td>
                        <td>${p.subjects.join(', ')}</td>
                    </tr>
                `;
            });
        }

        function loadManualSubjects() {
            const examId = document.getElementById('manual-exam-select').value;
            const exam = exams.find(e => e._id === examId);
            const area = document.getElementById('manual-subjects-area');
            area.innerHTML = '';
            if(!exam) return;
            exam.subjects.forEach(sub => {
                area.innerHTML += `<label style="display:block;"><input type="checkbox" name="manual-sub" value="${sub.name}"> ${sub.name}</label>`;
            });
        }

        async function generateManualPin() {
            const examId = document.getElementById('manual-exam-select').value;
            const deviceId = document.getElementById('manual-device-id').value.trim().toUpperCase();
            const customPin = document.getElementById('manual-pin-input').value.trim();
            
            const checked = document.querySelectorAll('input[name="manual-sub"]:checked');
            const subjects = Array.from(checked).map(cb => cb.value);

            if(!deviceId) return alert('Device ID is required so the user can access it.');
            if(subjects.length === 0) return alert('Select at least one subject.');
            if(!customPin) return alert('Enter a custom PIN (e.g., ABC123).');

            try {
                const res = await fetch(`${API_URL}/pins`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ examId, subjects, deviceId, manualPin: customPin })
                });
                const data = await res.json();
                if(data.success) {
                    alert(`PIN Generated Successfully: ${data.pin}`);
                    loadPinHistory(); // Refresh table
                } else {
                    alert(data.error);
                }
            } catch (e) { alert('Error generating PIN.'); }
        }

        // --- ENQUIRIES ---
        async function loadEnquiries() {
            const res = await fetch(`${API_URL}/enquiries`);
            const enquiries = await res.json();
            const tbody = document.getElementById('enquiry-table-body');
            tbody.innerHTML = '';
            enquiries.forEach(enq => {
                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(enq.date).toLocaleDateString()}</td>
                        <td>${enq.name}</td>
                        <td>${enq.phone}</td>
                        <td>${enq.email}</td>
                        <td>${enq.exam}</td>
                        <td>${enq.message}</td>
                        <td><button class="btn-reply" onclick="openReply('${enq.name}','${enq.email}')">Reply</button></td>
                    </tr>
                `;
            });
        }

        function openReply(name, email) {
            currentReplyData = { name, email };
            document.getElementById('reply-name').innerText = name;
            document.getElementById('reply-message').value = '';
            document.getElementById('email-status').innerText = '';
            document.getElementById('reply-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('reply-modal').style.display = 'none'; }

        async function sendEmailReply() {
            const msg = document.getElementById('reply-message').value;
            const status = document.getElementById('email-status');
            if(!msg) return alert('Type a message');
            status.innerText = 'Sending...';
            const templateParams = { to_name: currentReplyData.name, to_email: currentReplyData.email, reply_message: msg };
            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
                status.innerText = 'Email Sent Successfully!';
                setTimeout(closeModal, 2000);
            } catch (error) {
                status.style.color = 'red';
                status.innerText = 'Failed to send email.';
            }
        }
    </script>
</body>
</html>
