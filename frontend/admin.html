    <script>
        window.onload = function() {
            const ADMIN_PASSWORD = "admin123"; 
            const API_URL = 'https://success-academy-backend-mh1o.onrender.com/api'; 
            
            emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); 
            const EMAILJS_SERVICE_ID = "YOUR_SERVICE_ID"; 
            const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";

            let exams = [];
            let activeExam = null;
            let activeSubject = null;
            let currentReplyData = null;

            window.checkPassword = function() {
                if(document.getElementById('admin-password').value === ADMIN_PASSWORD) {
                    localStorage.setItem('sa_admin_logged_in', 'true');
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    initDashboard();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            };

            window.logout = function() {
                localStorage.removeItem('sa_admin_logged_in');
                window.location.reload();
            };

            window.switchTab = function(tabId, event) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                event.target.classList.add('active');
                document.getElementById('tab-' + tabId).classList.add('active');
                if(tabId === 'enquiries') loadEnquiries();
                if(tabId === 'pins') loadPinHistory();
            };

            async function initDashboard() {
                var select = document.getElementById('exam-select');
                select.innerHTML = '<option value="">-- Waking up server, please wait... --</option>';
                
                try {
                    const res = await fetch(`${API_URL}/exams`, { cache: "no-store" });
                    exams = await res.json();
                    select.innerHTML = '<option value="">-- Select Exam --</option>';
                    exams.forEach(exam => { select.innerHTML += `<option value="${exam._id}">${exam.name}</option>`; });
                    
                    const manualSelect = document.getElementById('manual-exam-select');
                    manualSelect.innerHTML = '';
                    exams.forEach(exam => { manualSelect.innerHTML += `<option value="${exam._id}">${exam.name}</option>`; });
                    loadManualSubjects();
                } catch (e) { 
                    select.innerHTML = '<option value="">-- Server sleeping. Refresh page --</option>';
                }
            }
